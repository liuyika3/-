<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taco Bell 食物图片预览</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .stats {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            color: #666;
            margin-top: 5px;
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        
        .card-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            background: #f5f5f5;
        }
        
        .card-body {
            padding: 20px;
        }
        
        .card-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        
        .card-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            color: #999;
        }
        
        .badge {
            display: inline-block;
            padding: 5px 12px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 500;
        }
        
        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal-content {
            position: relative;
            margin: 50px auto;
            max-width: 90%;
            max-height: 90%;
            animation: zoomIn 0.3s;
        }
        
        @keyframes zoomIn {
            from { transform: scale(0.7); }
            to { transform: scale(1); }
        }
        
        .modal-image {
            width: 100%;
            height: auto;
            border-radius: 10px;
        }
        
        .close {
            position: absolute;
            top: -40px;
            right: 0;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s;
        }
        
        .close:hover {
            color: #667eea;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.5em;
        }
        
        .error {
            text-align: center;
            padding: 40px;
            color: #ff6b6b;
            font-size: 1.2em;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌮 Taco Bell 食物图片库</h1>
            <p>AI 生成的专业食物图片 - Powered by Vertex AI Nano Banana</p>
        </header>
        
        <div class="stats" id="stats">
            <div class="stat-item">
                <div class="stat-number" id="totalCount">-</div>
                <div class="stat-label">总图片数</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="generatedToday">-</div>
                <div class="stat-label">今日生成</div>
            </div>
        </div>
        
        <div id="loading" class="loading">
            正在加载图片...
        </div>
        
        <div class="gallery" id="gallery"></div>
    </div>
    
    <!-- 模态框 -->
    <div id="modal" class="modal" onclick="closeModal()">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <img id="modalImage" class="modal-image" src="" alt="">
        </div>
    </div>
    
    <script>
        // 图片数据（需要手动更新或通过脚本自动生成）
        const images = [
            {
                filename: "001_Bell Sauce Dipping Sauce_20260130_172357.png",
                name: "Bell Sauce Dipping Sauce",
                timestamp: "2026-01-30 17:23:57"
            },
            {
                filename: "002_Chicken Nuggets - 5 Piece_20260130_172412.png",
                name: "Chicken Nuggets - 5 Piece",
                timestamp: "2026-01-30 17:24:12"
            },
            {
                filename: "003_Chicken Nuggets - 10 Piece_20260130_172425.png",
                name: "Chicken Nuggets - 10 Piece",
                timestamp: "2026-01-30 17:24:25"
            }
        ];
        
        // 渲染图片库
        function renderGallery() {
            const gallery = document.getElementById('gallery');
            const loading = document.getElementById('loading');
            
            if (images.length === 0) {
                loading.innerHTML = '<div class="error">暂无图片</div>';
                return;
            }
            
            loading.style.display = 'none';
            
            images.forEach((img, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openModal(img.filename);
                
                card.innerHTML = `
                    <img class="card-image" src="${img.filename}" alt="${img.name}" loading="lazy">
                    <div class="card-body">
                        <div class="card-title">${img.name}</div>
                        <div class="card-meta">
                            <span class="badge">#${(index + 1).toString().padStart(3, '0')}</span>
                            <span>${img.timestamp.split(' ')[0]}</span>
                        </div>
                    </div>
                `;
                
                gallery.appendChild(card);
            });
            
            updateStats();
        }
        
        // 更新统计信息
        function updateStats() {
            document.getElementById('totalCount').textContent = images.length;
            
            const today = new Date().toISOString().split('T')[0].replace(/-/g, '');
            const todayCount = images.filter(img => 
                img.filename.includes(today)
            ).length;
            document.getElementById('generatedToday').textContent = todayCount;
        }
        
        // 打开模态框
        function openModal(filename) {
            const modal = document.getElementById('modal');
            const modalImage = document.getElementById('modalImage');
            modal.style.display = 'block';
            modalImage.src = filename;
        }
        
        // 关闭模态框
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
        
        // 键盘事件
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
        
        // 页面加载完成后渲染
        window.onload = renderGallery;
    </script>
</body>
</html>
