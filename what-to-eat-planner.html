<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What to Eat Planner</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes walk {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes waveBody {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(5deg); }
    }
    @keyframes waveHand {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(20deg); }
    }
    @keyframes ear-left {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }
    @keyframes ear-right {
      0%, 100% { transform: rotate(5deg); }
      50% { transform: rotate(-5deg); }
    }
    .animate-walk { animation: walk 0.6s infinite ease-in-out; }
    .animate-wave-body { transform-origin: bottom center; animation: waveBody 1s infinite ease-in-out; }
    .animate-wave-hand { transform-origin: 75px 60px; animation: waveHand 0.8s infinite ease-in-out; }
    .animate-ear-left { transform-origin: 40px 35px; animation: ear-left 1.2s infinite ease-in-out; }
    .animate-ear-right { transform-origin: 60px 35px; animation: ear-right 1.2s infinite ease-in-out; }
    .perspective-1000 { perspective: 1000px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    @keyframes slideUp {
      from { transform: translateY(15px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up { animation: slideUp 0.4s ease-out forwards; }
    @keyframes bounceIn {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .animate-bounce-in { animation: bounceIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    @keyframes popIn {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .animate-pop-in { animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .demo-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 1rem;
      transition: all 0.2s;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }
    .demo-btn:hover {
      background: #eef2ff;
    }
    .demo-btn:active {
      transform: scale(0.95);
    }
    .demo-btn .p-2 {
      padding: 0.5rem;
      background: #f9fafb;
      border-radius: 0.5rem;
      transition: background-color 0.2s;
    }
    .demo-btn:hover .p-2 {
      background: #e0e7ff;
    }
    .demo-btn:hover i {
      color: #4f46e5 !important;
    }
    .pill-btn {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.5rem 0.75rem;
      border-radius: 9999px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .pill-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>

      { id: 502, title: '避开"伪健康"沙拉陷阱', type: 'article', tags: ['避雷指南', '干货'], content: '许多餐厅沙拉酱的热量比汉堡还高！教你 3 步识别隐形热量炸弹...', imageColor: 'bg-emerald-100', aiReason: '这篇干货非常适合经常点外卖的你。' }
    ];

    const filterOptions = {
      decision: { time: ['10 min', '20 min'], people: ['1人食', '2人约会'], taste: ['清淡', '重口', '辣'], budget: ['50元以内', '不差钱'] },
      meal_prep: { prep_days: ['3天', '5天', '一周'], storage: ['冷藏', '冷冻'], grocery: ['生成清单'], strategy: ['批处理'] },

    };

    // Estimate nutrients function
    function estimateNutrients(item) {
      const c = parseInt(item.calories) || 0;
      if (c === 0) return null;
      return {
        protein: Math.round(c * 0.08) + 'g',
        carbs: Math.round(c * 0.1) + 'g',
        fat: Math.round(c * 0.04) + 'g',
        fiber: Math.round(c * 0.02) + 'g',
        sugar: Math.round(c * 0.01) + 'g',
        sodium: Math.round(c * 1.5) + 'mg'
      };
    }

    const quickActionConfigs = {
      decision: [
        { icon: 'timer', label: '时间', filter: 'time' },
        { icon: 'users', label: '人数', filter: 'people' },
        { icon: 'sliders-horizontal', label: '口味', filter: 'taste' },
        { icon: 'dollar-sign', label: '预算', filter: 'budget' }

        { icon: 'file-text', label: '形式', filter: 'format' }
      ]
    };

    // Helper Functions
    function createRabbit(state) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 100 100');
      svg.className = `w-full h-full ${state === 'walking' ? 'animate-walk' : state === 'waving' ? 'animate-wave-body' : ''}`;
      
      const earLeft = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
      earLeft.setAttribute('cx', '40');
      earLeft.setAttribute('cy', '20');
      earLeft.setAttribute('rx', '6');
      earLeft.setAttribute('ry', '15');
      earLeft.setAttribute('fill', '#FFF');
      if (state === 'walking') earLeft.className = 'animate-ear-left';
      
      const earRight = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
      earRight.setAttribute('cx', '60');
      earRight.setAttribute('cy', '20');
      earRight.setAttribute('rx', '6');
      earRight.setAttribute('ry', '15');
      earRight.setAttribute('fill', '#FFF');
      if (state === 'walking') earRight.className = 'animate-ear-right';
      
      const body = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      body.setAttribute('cx', '50');

    function getRecentChat() {
      const lastAiIndex = chatHistory.findLastIndex(msg => msg.role === 'ai');
      if (lastAiIndex === -1) return chatHistory.slice(-1);
      const relevantMsgs = [];
      if (lastAiIndex > 0 && chatHistory[lastAiIndex - 1].role === 'user') {
        relevantMsgs.push(chatHistory[lastAiIndex - 1]);
      }
      relevantMsgs.push(chatHistory[lastAiIndex]);
      return relevantMsgs;
    }

      const isHome = currentView === 'home';

      document.getElementById('secondary-view').classList.toggle('hidden', !isSecondary);
      document.getElementById('detail-view').classList.toggle('hidden', !isDetail);
      document.getElementById('home-actions').classList.toggle('hidden', !isHome);
      document.getElementById('secondary-actions').classList.toggle('hidden', !isSecondary);
      document.getElementById('detail-bottom').classList.toggle('hidden', !isDetail);
      document.getElementById('home-chat').classList.toggle('hidden', !isHome);
      document.getElementById('back-btn').classList.toggle('hidden', isHome);
      document.getElementById('chat-messages').classList.toggle('hidden', isDetail);

    function handleNavigate(view) {
      currentView = view;
      activePortals = activePortals.filter(p => p !== view);
      interactionStep = 'initial';
      searchQuery = '';
      
      // Update UI
      updateViewVisibility();
      document.getElementById('search-input').value = '';
      
      // Initialize data
      if (view === 'decision') {
        displayItems = [...initialItems];
        rabbitAnimation = 'waving';
        chatHistory.push({ role: 'ai', title: "What to Eat? 👋", content: "结合你今天的运动量，<span class='text-rose-500 font-bold'>轻食沙拉</span>或<span class='text-rose-500 font-bold'>高蛋白意面</span>都很合适。" });
      } else if (view === 'meal_prep') {
        displayItems = [...mealPrepItems];
        rabbitAnimation = 'waving';
        chatHistory.push({ role: 'ai', title: "开启 Meal Prep 模式！👋", content: "一次准备多天的饮食，省力又控卡。我们可以先从<span class='text-indigo-600 font-bold'>备餐天数</span>开始。" });
      } else if (view === 'snack') {
        displayItems = [...snackItems];
        rabbitAnimation = 'waving';
        chatHistory.push({ role: 'ai', title: "嘴馋了吗？👋", content: "别担心，选对零食也是健康的一部分。你是<span class='text-amber-600 font-bold'>想吃甜的</span>还是<span class='text-amber-600 font-bold'>想吃脆的</span>？" });
      } else if (view === 'knowledge') {
        displayItems = [...knowledgeItems];
        rabbitAnimation = 'waving';
        chatHistory.push({ role: 'ai', title: "Jovida 课堂开课啦！🎓", content: "碎片时间学点干货。今天为你准备了一个<span class='text-purple-600 font-bold'>关于饥饿感的小测验</span>，要试试吗？" });
      } else {
        rabbitAnimation = 'idle';
      }
      
      // Update secondary view title
      const titleMap = {
        'meal_prep': 'Meal Prep Plan',
        'snack': 'Smart Snacking',
        'knowledge': 'Jovida Wiki',
        'decision': 'What to Eat'
      };
      const colorMap = {
        'meal_prep': 'text-indigo-800',
        'snack': 'text-amber-800',
        'knowledge': 'text-purple-800',
        'decision': 'text-gray-900'
      };
      document.getElementById('secondary-title').textContent = titleMap[view] || '';
      document.getElementById('secondary-title').className = `text-xl font-black uppercase tracking-wider ${colorMap[view] || 'text-gray-900'}`;
      
      // Update rabbit
      const rabbitContainer = view === 'home' 
        ? document.getElementById('home-rabbit')
        : document.getElementById('secondary-rabbit');
      rabbitContainer.innerHTML = '';
      rabbitContainer.appendChild(createRabbit(rabbitAnimation));
      
      if (view !== 'home' && view !== 'detail') {
        setTimeout(() => {
          rabbitAnimation = 'idle';
          const rabbitContainer = document.getElementById('secondary-rabbit');
          rabbitContainer.innerHTML = '';
          rabbitContainer.appendChild(createRabbit('idle'));
        }, 2000);
      }
      
      if (view === 'home') {
        renderChallenges();
        renderChatMessages();
      } else if (view !== 'detail') {
        renderItems();
        renderChatMessages();
        renderQuickActions();
      }
      renderPortalButtons();
      activeFilter = null;
      renderFilterPanel();
    }

    function goBackHome() {
      if (currentView !== 'home' && currentView !== 'detail' && !activePortals.includes(currentView)) {
        activePortals.push(currentView);
      }
      currentView = 'home';
      rabbitAnimation = 'walking';
      handleNavigate('home');
    }

    function handleOptionSelect(type, option) {
      const trimmed = searchQuery.trim();
      searchQuery = trimmed ? `${trimmed} ${option}` : option;
      document.getElementById('search-input').value = searchQuery;
      activeFilter = null;
      renderFilterPanel();
    }

    function setActiveFilter(filter) {
      activeFilter = filter;
      renderFilterPanel();
    }

    function handleRestaurantSelected() {
      interactionStep = 'restaurant_selected';
      chatHistory.push({ role: 'ai', title: "哦？你都选好了啊！😲", content: "可以告诉我是哪家吗？或者给我<span class='text-indigo-600 font-bold'>拍一下菜单</span>，我帮你避雷。" });
      document.getElementById('search-input').placeholder = "输入店名或拍照...";
      document.getElementById('camera-btn').classList.remove('hidden');
      document.getElementById('cancel-restaurant').classList.remove('hidden');
      document.getElementById('submit-btn').innerHTML = '<i data-lucide="camera" class="w-4 h-4"></i>';
      renderQuickActions();
      renderChatMessages();
      initIcons();
    }

    function handleSearchSubmit() {
      interactionStep = 'results_shown';
      const userMsg = { role: 'user', content: searchQuery || '推荐一下' };
      let aiMsg = { role: 'ai', title: "刷新推荐 ✨", content: "根据你的要求，我调整了推荐列表。" };
      
      if (currentView === 'snack') {
        displayItems = [{ id: 403, name: '搜索结果', dish: `${searchQuery} 组合`, scene: 'snack', type: '满足推荐', calories: '200', matchScore: 99, tags: ['解馋', '平衡'], imageColor: 'bg-pink-100', aiReason: '这个组合完美满足你的口味，且热量在安全范围内。' }, ...snackItems];
        aiMsg.content = "找到了！这个组合既能满足你的味蕾，又不会让你今天的努力白费。";
      } else if (currentView === 'knowledge') {
        displayItems = [{ id: 503, title: `关于"${searchQuery}"的真相`, type: 'article', tags: ['深度好文'], content: '点击阅读深度解析...', imageColor: 'bg-blue-100', aiReason: '这是目前学术界对该话题的最新共识。' }, ...knowledgeItems];
        aiMsg.content = `关于"${searchQuery}"，其实有很多误区，这篇内容能帮你理清思路。`;
      } else if (currentView === 'meal_prep') {
        displayItems = [{ id: 301, name: '定制备餐', dish: `定制：${searchQuery}`, scene: 'meal_prep', type: '专属', calories: '500', matchScore: 98, keepDays: '5天', servings: '5份', tags: ['定制'], imageColor: 'bg-indigo-900', aiReason: '已优化食材配比。' }, ...mealPrepItems];
        aiMsg.content = "备餐计划已生成！已为你计算好分装比例。";
      } else {
        displayItems = [{ id: 101, name: '搜索结果', dish: `满足"${searchQuery}"`, scene: 'out', type: '推荐', calories: '500', matchScore: 97, tags: ['推荐'], imageColor: 'bg-blue-50', aiReason: '最符合当前需求的推荐。' }];
        aiMsg.content = "为你找到了这个最佳选项！";
      }
      
      chatHistory.push(userMsg, aiMsg);
      activeFilter = null;
      renderItems();
      renderChatMessages();
      renderFilterPanel();
    }

    function sendMessage() {
      const input = document.getElementById('home-input');
      if (!input.value.trim()) return;
      const newMsg = { role: 'user', content: input.value };
      chatHistory.push(newMsg);
      input.value = '';
      inputText = '';
      renderChatMessages();
      
      setTimeout(() => {
        chatHistory.push({ role: 'ai', title: "Jovida 正在思考...", content: `针对"${newMsg.content}"，我的建议是...` });
        renderChatMessages();
      }, 1000);
    }

    function handleDemoCase(caseId) {
      switch(caseId) {
        case 1: handleNavigate('decision'); break;
        case 2: 
          handleNavigate('decision');
          searchQuery = '轻食沙拉';
          document.getElementById('search-input').value = searchQuery;
          break;
        case 3:
          handleNavigate('decision');
          chatHistory.push({role:'ai', title:'晚餐提早吃？', content:'那我们可以吃点低负担的。'});
          renderChatMessages();
          break;
        case 4:
          handleNavigate('decision');
          handleRestaurantSelected();
          break;
        case 5:
          currentView = 'home';
          chatHistory.push({role:'ai', title:'打卡成功！🏆', content:'奖励已到账。'});
          handleNavigate('home');
          break;
        case 6: handleNavigate('snack'); break;
        case 7: handleNavigate('meal_prep'); break;
        case 8: handleNavigate('meal_prep'); break;
        case 9: handleNavigate('meal_prep'); break;
        case 10:
          currentView = 'home';
          activeChallengeIndex = 2;
          chatHistory.push({ role: 'user', content: '我想聊聊关于喝水的话题' }, { role: 'ai', title: "关于喝水 💧", content: "没问题！你觉得自己每天喝水少是因为**忘记喝**还是**不喜欢白水的味道**？" });
          handleNavigate('home');
          break;
        default: break;
      }
    }

    // Event Listeners
    document.addEventListener('DOMContentLoaded', () => {
      // Initialize Lucide icons - wait for library to be ready
      const waitForIcons = () => {
        if (typeof lucide !== 'undefined' && lucide.createIcons) {
          initIcons();
        } else {
          setTimeout(waitForIcons, 100);
        }
      };
      waitForIcons();
      
      // Demo buttons
      document.querySelectorAll('.demo-btn').forEach(btn => {
        btn.onclick = () => handleDemoCase(parseInt(btn.dataset.case));
      });
      
      // Pill buttons
      document.querySelectorAll('.pill-btn').forEach(btn => {
        btn.onclick = () => handleNavigate(btn.dataset.view);
      });
      
      // Challenge navigation
      document.getElementById('prev-challenge').onclick = () => {
        activeChallengeIndex = (activeChallengeIndex - 1 + challenges.length) % challenges.length;
        renderChallenges();
      };
      document.getElementById('next-challenge').onclick = () => {
        activeChallengeIndex = (activeChallengeIndex + 1) % challenges.length;
        renderChallenges();
      };
      
      // Back button
      document.getElementById('back-btn').onclick = () => {
        if (currentView === 'detail') {
          closeDetail();
        } else {
          goBackHome();
        }
      };
      
      // Confirm choice button
      document.getElementById('confirm-choice-btn').onclick = confirmChoice;
      
      // Search input
      document.getElementById('search-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleSearchSubmit();
      });
      document.getElementById('search-input').addEventListener('input', (e) => {
        searchQuery = e.target.value;
      });
      
      // Submit button
      document.getElementById('submit-btn').onclick = handleSearchSubmit;
      
      // Close filter
      document.getElementById('close-filter').onclick = () => {
        activeFilter = null;
        renderFilterPanel();
      };
      
      // Cancel restaurant
      document.getElementById('cancel-restaurant').onclick = () => {
        interactionStep = 'initial';
        document.getElementById('search-input').placeholder = "输入需求...";
        document.getElementById('camera-btn').classList.add('hidden');
        document.getElementById('cancel-restaurant').classList.add('hidden');
        document.getElementById('submit-btn').innerHTML = '<i data-lucide="send" class="w-3.5 h-3.5"></i>';
        initIcons();
        renderQuickActions();
      };
      
      // Home input
      document.getElementById('home-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendMessage();
      });
      document.getElementById('home-input').addEventListener('input', (e) => {
        inputText = e.target.value;
      });
      document.getElementById('home-send').onclick = sendMessage;
      
      // Initial render
      updateViewVisibility();
      renderChallenges();
      renderChatMessages();
      document.getElementById('home-rabbit').appendChild(createRabbit('walking'));
      
      // Ensure icons are initialized after all content is loaded
      setTimeout(initIcons, 500);
    });
    
    // Also initialize on window load
    window.addEventListener('load', () => {
      initIcons();
    });
  </script>
</body>
</html>
