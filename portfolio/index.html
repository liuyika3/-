<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作品集入口</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0b0f14; color: #e2e8f0; padding: 2rem; max-width: 44rem; margin: 0 auto; line-height: 1.65; }
    a { color: #2dd4bf; }
    code { background: #1c2433; padding: 0.15em 0.45em; border-radius: 4px; font-size: 0.88em; }
    ol { padding-left: 1.25rem; }
  </style>
</head>
<body>
  <h1>作品集入口</h1>
  <p>请使用聚合应用 <strong>vibe-portfolio</strong>（含工具自动化、产品 Feature、<strong>减脂教练业务展示</strong>、科普物料与单页等）。</p>
  <ol>
    <li>终端进入本仓库下的：<code>vibe-portfolio</code> 目录（即克隆目录 <code>…/vibe-portfolio</code>）</li>
    <li>执行 <code>npm run dev</code>，浏览器打开提示的本地地址。</li>
    <li>可选：若 pre 不在默认旁路路径，设置环境变量 <code>JOVIDA_PRE_ROOT</code> 指向 pre 目录。</li>
  </ol>
  <p>勿用 <code>file://</code> 直接打开 <code>dist/index.html</code>，内嵌预览依赖本地 HTTP。</p>
</body>
</html>
