<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行准备官 — 万物教练</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f4ef; --card: #ffffff; --dark: #1c1c22;
  --teal: #0f766e; --teal-light: rgba(15,118,110,.1); --gold: #d97706;
  --text: #1c1c22; --muted: #888; --border: #e5e0d8;
  --navy: #1e3a5f;
}
body { background: #dcdedf; color: var(--text); font-family: Georgia, 'Times New Roman', serif; min-height: 100vh; display:flex; justify-content:center; align-items:center; padding:40px 0; }

/* ── Masthead ── */
.masthead {
  background: var(--dark); color: #f0ece4;
  padding: 0 40px; height: 56px; display: flex; align-items: center; gap: 20px;
}
.m-title { font-size: 18px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #f0ece4; }
.m-divider { color: #555; }
.m-sub { font-size: 11px; letter-spacing: .15em; text-transform: uppercase; color: #888; font-family: -apple-system, sans-serif; }
.m-date { margin-left: auto; font-size: 11px; color: #666; font-family: -apple-system, sans-serif; }

/* ── Cover ── */
.cover { background: var(--dark); color: #f0ece4; padding: 72px 40px 64px; position: relative; overflow: hidden; }
.cover::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 70% 50%, rgba(15,118,110,.3) 0%, transparent 60%);
  pointer-events: none;
}
.cover-inner { max-width: 800px; position: relative; }
.cover-kicker { font-size: 11px; font-weight: 600; letter-spacing: .25em; text-transform: uppercase; color: var(--teal); margin-bottom: 16px; font-family: -apple-system, sans-serif; }
.cover-title { font-size: clamp(40px, 7vw, 80px); line-height: 1.05; font-weight: 700; margin-bottom: 18px; }
.cover-title span { color: var(--teal); font-style: italic; }
.cover-sub { font-size: 16px; color: rgba(240,236,228,.65); line-height: 1.7; max-width: 500px; font-family: -apple-system, sans-serif; }
.cover-sub b { color: #f0ece4; }

/* ── Search bar ── */
.search-bar {
  background: var(--card); border-bottom: 1px solid var(--border);
  padding: 20px 40px; display: flex; align-items: center; gap: 14px;
  flex-wrap: wrap;
}
.sb-label { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-family: -apple-system, sans-serif; white-space: nowrap; }
.sb-input {
  flex: 1; min-width: 200px; max-width: 360px;
  background: var(--bg); border: 1.5px solid var(--border); color: var(--text);
  font-size: 15px; padding: 11px 16px; border-radius: 10px; outline: none;
  transition: border 200ms; font-family: -apple-system, sans-serif;
}
.sb-input:focus { border-color: var(--teal); }
.sb-input::placeholder { color: #bbb; }
.sb-btn {
  background: var(--teal); color: #fff; border: none; padding: 11px 22px;
  border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer;
  transition: all 180ms; white-space: nowrap; font-family: -apple-system, sans-serif;
  letter-spacing: .03em;
}
.sb-btn:hover { background: #0e6860; }
.sb-btn:disabled { background: #ccc; cursor: not-allowed; }
.dest-pills { display: flex; gap: 7px; flex-wrap: wrap; }
.dp {
  background: transparent; border: 1.5px solid var(--border); color: var(--muted);
  padding: 5px 12px; border-radius: 20px; font-size: 12px; cursor: pointer;
  transition: all 150ms; font-family: -apple-system, sans-serif;
}
.dp:hover { border-color: var(--teal); color: var(--teal); }

/* ── Loading ── */
.loading { display: none; padding: 80px 40px; text-align: center; }
.loading.show { display: block; }
.loading-icon { font-size: 36px; display: inline-block; animation: spin 3s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 14px; color: var(--muted); margin-top: 16px; font-family: -apple-system, sans-serif; }

/* ── Error ── */
.err-box { display:none; font-size:13px; color:#cc0000; padding:10px 0; font-family:-apple-system,sans-serif; }
.err-box.show { display:block; }

/* ── Results ── */
.results { display: none; }
.results.show { display: block; }

/* ── Feature spread ── */
.feature-spread { padding: 48px 40px 0; max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
@media(max-width:800px){ .feature-spread{grid-template-columns:1fr} }

/* Wiki column */
.wiki-col {}
.wiki-col-label { font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--teal); margin-bottom: 12px; font-family: -apple-system, sans-serif; }
.wiki-dest-title { font-size: 30px; font-weight: 700; line-height: 1.2; margin-bottom: 6px; }
.wiki-desc { font-size: 14px; color: var(--teal); font-style: italic; margin-bottom: 18px; }
.wiki-img { width: 100%; height: 220px; object-fit: cover; border-radius: 12px; display: block; margin-bottom: 18px; }
.wiki-img-ph { width: 100%; height: 220px; background: #e5e0d8; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 48px; margin-bottom: 18px; }
.wiki-text { font-size: 15px; line-height: 1.8; color: #3a3a3a; }
.wiki-read { display: inline-block; margin-top: 16px; font-size: 13px; font-weight: 600; color: var(--teal); text-decoration: none; font-family: -apple-system, sans-serif; }
.wiki-read:hover { text-decoration: underline; }

/* Hotels column */
.hotels-col {}
.hotels-col-label { font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; font-family: -apple-system, sans-serif; }
.hotel-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; overflow: hidden; margin-bottom: 14px;
  display: flex; transition: all 180ms; text-decoration: none; color: var(--text);
}
.hotel-card:hover { box-shadow: 0 6px 24px rgba(0,0,0,.1); transform: translateY(-2px); }
.hotel-img { width: 110px; flex-shrink: 0; object-fit: cover; display: block; background: #e5e0d8; }
.hotel-img-ph { width: 110px; flex-shrink: 0; background: #e5e0d8; display: flex; align-items: center; justify-content: center; font-size: 24px; }
.hotel-body { padding: 14px 16px; flex: 1; }
.hotel-name { font-size: 14px; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
.hotel-meta { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.hotel-tag { font-size: 11px; font-family: -apple-system, sans-serif; }
.ht-stars { color: var(--gold); }
.ht-rating { color: var(--teal); font-weight: 600; }
.ht-loc { color: var(--muted); }
.hotel-price { font-size: 18px; font-weight: 900; color: var(--navy); font-family: -apple-system, sans-serif; }

/* ── Divider ── */
.section-divider { max-width: 1100px; margin: 48px auto 0; padding: 0 40px; border-top: 2px solid var(--dark); display: flex; align-items: center; gap: 16px; padding-top: 20px; }
.sd-title { font-size: 13px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; color: var(--dark); font-family: -apple-system, sans-serif; }
.sd-line { flex: 1; height: 1px; background: var(--border); }

/* ── Videos strip ── */
.videos-section { padding: 24px 40px 0; max-width: 1100px; margin: 0 auto; }
.videos-scroll { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 8px; }
.videos-scroll::-webkit-scrollbar { height: 4px; }
.videos-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.yt-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; overflow: hidden; min-width: 240px; max-width: 260px; flex-shrink: 0;
  text-decoration: none; color: var(--text); transition: all 180ms; display: block;
}
.yt-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,.1); transform: translateY(-2px); }
.yt-thumb { width: 100%; height: 140px; object-fit: cover; display: block; background: #e5e0d8; }
.yt-thumb-ph { width: 100%; height: 140px; background: #e5e0d8; display: flex; align-items: center; justify-content: center; font-size: 32px; }
.yt-body { padding: 12px 14px; }
.yt-title { font-size: 13px; font-weight: 700; line-height: 1.4; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.yt-meta { font-size: 11px; color: var(--muted); font-family: -apple-system, sans-serif; }

/* ── Reddit ── */
.reddit-section { padding: 24px 40px 100px; max-width: 1100px; margin: 0 auto; }
.reddit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.rc {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px;
  transition: all 180ms;
}
.rc:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); }
.rc-sub { font-size: 11px; font-weight: 700; color: var(--teal); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 6px; font-family: -apple-system, sans-serif; }
.rc-title { font-size: 14px; font-weight: 700; line-height: 1.4; margin-bottom: 8px; }
.rc-body { font-size: 12px; color: var(--muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 10px; font-family: -apple-system, sans-serif; }
.rc-meta { display: flex; gap: 10px; align-items: center; font-family: -apple-system, sans-serif; }
.rc-score { font-size: 11px; color: var(--muted); }
.rc-link { font-size: 11px; font-weight: 700; color: var(--teal); text-decoration: none; margin-left: auto; }

.empty { font-size: 13px; color: var(--muted); font-family: -apple-system, sans-serif; padding: 12px 0; }

/* ── Jovida Mobile Template (from Fitness Lab) ── */
.app-container {
  width: 390px;
  height: 844px;
  background: #f4f5f7;
  border-radius: 44px;
  box-shadow: 0 24px 80px rgba(0,0,0,0.15), inset 0 0 0 8px #000;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}
.jl-header {
  background: linear-gradient(180deg, #0f766e 0%, #d97706 100%);
  padding: 54px 24px 32px;
  color: white;
  flex-shrink: 0;
  position: relative;
  z-index: 2;
}
.top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px; }
.user-avatar {
  width: 36px; height: 36px;
  background: rgba(255,255,255,0.18);
  border-radius: 50%;
  display:flex; align-items:center; justify-content:center;
  font-size:16px;
}
.streaks {
  display:flex; gap:12px; font-weight:700; font-size:13px;
  background: rgba(0,0,0,0.15);
  padding: 8px 14px;
  border-radius: 20px;
}
.tabs { display:flex; gap:20px; font-size:15px; font-weight:600; color: rgba(255,255,255,0.62); align-items:center; }
.tab.active { color: #fff; background: rgba(255,255,255,0.2); padding: 6px 14px; border-radius: 20px; }
.main-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 0 20px 160px;
  margin-top: -8px;
  position: relative;
  z-index: 1;
}
.main-scroll::-webkit-scrollbar { display:none; }
.ob-card {
  background: white;
  border-radius: 24px;
  padding: 24px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.04);
  margin-top: 24px;
  transition: all 300ms;
}
.ob-q {
  font-size: 18px;
  font-weight: 800;
  color: #111;
  margin-bottom: 16px;
  text-align:center;
}
.ob-opts { display:flex; flex-direction:column; gap: 12px; }
.ob-opt {
  background: #f8f9fa;
  border: 1px solid #e9ecef;
  color: #333;
  padding: 16px;
  border-radius: 16px;
  font-size: 15px;
  font-weight: 600;
  cursor:pointer;
  transition: all 150ms;
  text-align:center;
}
.ob-opt.selected { background: #fff0dd; border-color: #d97706; color: #8a5a00; }
.tr-hidden { display:none !important; }

/* hide original desktop cover/search */
.masthead, .cover, .search-bar { display:none !important; }

.bottom-input {
  position:absolute;
  bottom:0; left:0; right:0;
  padding: 24px 20px 32px;
  background: linear-gradient(to top, rgba(244,245,247,1) 70%, transparent);
  display:flex; align-items:center; gap: 12px;
}
.b-input {
  flex:1;
  background:white;
  border:none;
  border-radius:24px;
  padding: 16px 20px;
  font-size: 15px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.06);
  outline:none;
}
.b-input::placeholder { color:#bbb; font-weight:500; }
.b-fab {
  width:52px; height:52px; border-radius:50%;
  background:#0f766e; color:white;
  border:none;
  font-size: 28px;
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 8px 20px rgba(15,118,110,0.35);
  font-weight:300;
}

/* --- Mobile UI Design System Overrides --- */
:root {
  --color-background: #E7E9EC;
  --color-surface: #F2F2F2;
  --color-surface-elevated: #FFFFFF;
  --color-text-primary: #000000;
  --color-text-secondary: rgba(0,0,0,0.4);
  --color-text-tertiary: rgba(0,0,0,0.2);
  --color-border: rgba(255,255,255,0.5);
  --color-divider: rgba(0,0,0,0.05);
  
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-2xl: 24px;
  --radius-3xl: 32px;
  --radius-full: 100px;
  
  --shadow-sm: 0px 4px 8px rgba(0,0,0,0.05);
  --shadow-md: 0px 8px 16px rgba(0,0,0,0.03);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'Segoe UI', sans-serif;
  font-variation-settings: 'wdth' 100;
  background: var(--color-background);
}

.app-container {
  background: var(--color-background);
}

/* Header */
.jl-header {
  background: linear-gradient(0deg, #EBE172 0%, #FF7300 100%);
}
.tab.active { background: rgba(255,255,255,0.2); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }

/* Onboarding */
.ob-card {
  background: var(--color-surface);
  border-radius: var(--radius-2xl);
  padding: 16px;
  border: 1px solid var(--color-border);
  box-shadow: var(--shadow-sm);
}
.ob-q { color: var(--color-text-primary); font-size: 20px; font-weight: 590; margin-bottom: 16px; }
.ob-opt {
  background: var(--color-surface-elevated);
  border-radius: var(--radius-3xl);
  border: 1px solid var(--color-border);
  box-shadow: var(--shadow-sm);
  color: var(--color-text-primary);
  font-weight: 590;
  height: 48px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.ob-opt.selected {
  background: linear-gradient(180deg, #000000 0%, #575757 100%);
  color: #ACFF4E;
  border: none;
}

/* Results Overrides */
.feature-spread { display: flex; flex-direction: column; gap: 16px; padding: 24px 20px 0; max-width: none; }
.wiki-col, .hotels-col, .rc {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-2xl);
  box-shadow: var(--shadow-sm);
  padding: 16px;
  color: var(--color-text-primary);
}

.wiki-col-label, .hotels-col-label, .sd-title {
  color: var(--color-text-secondary);
  font-size: 14px; font-weight: 700; margin-bottom: 12px; text-transform: none; letter-spacing: normal;
}
.wiki-dest-title { font-size: 24px; font-weight: 700; color: var(--color-text-primary); margin-bottom: 8px; }
.wiki-desc { color: var(--color-text-secondary); font-size: 14px; font-style: normal; margin-bottom: 16px; }
.wiki-text { color: var(--color-text-primary); font-size: 16px; line-height: 1.5; }
.wiki-read { color: #FF7300; font-weight: 590; }

.hotel-card {
  background: var(--color-surface-elevated);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}
.hotel-body { padding: 12px; }
.hotel-name { font-size: 16px; color: var(--color-text-primary); font-weight: 590; }
.hotel-meta .hotel-tag { color: var(--color-text-secondary); font-size: 14px; }
.ht-rating { color: #FF7300; }
.hotel-price { font-size: 18px; font-family: 'Urbanist', sans-serif; font-weight: 800; color: var(--color-text-primary); }

.section-divider { padding: 0 20px; border: none; margin: 24px 0 16px; }
.sd-line { display: none; }
.videos-section { padding: 0 20px; }

.yt-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}
.yt-title { color: var(--color-text-primary); font-size: 14px; font-weight: 590; }
.yt-meta { color: var(--color-text-secondary); }

.reddit-section { padding: 0 20px 160px; }
.reddit-grid { display: flex; flex-direction: column; gap: 12px; }
.rc-sub { color: #FF7300; letter-spacing: normal; font-size: 12px; }
.rc-title { color: var(--color-text-primary); font-size: 16px; font-weight: 590; }
.rc-body { color: var(--color-text-secondary); font-size: 14px; }
.rc-score { color: var(--color-text-secondary); font-size: 12px; }
.rc-link { color: #FF7300; font-weight: 590; }

.bottom-input { background: linear-gradient(to top, var(--color-background) 70%, transparent); }
.b-input {
  background: var(--color-surface-elevated);
  border: 1px solid var(--color-border);
  box-shadow: var(--shadow-sm);
  color: var(--color-text-primary);
  border-radius: var(--radius-full);
}
.b-input::placeholder { color: var(--color-text-secondary); }
.b-fab {
  background: linear-gradient(180deg, #000000 0%, #575757 100%);
  color: #ACFF4E;
  box-shadow: var(--shadow-md);
}


.main-scroll {
  padding-bottom: 160px !important;
}

  <div class="sb-label">目的地</div>
  <input class="sb-input" id="inp" placeholder="如 Tokyo / Paris / Bali / New York..." />
  <button class="sb-btn" id="btn" onclick="explore()">出发准备</button>
  <div class="dest-pills">
    <span class="dp" onclick="q('Tokyo')">东京</span>
    <span class="dp" onclick="q('Paris')">巴黎</span>
    <span class="dp" onclick="q('Bali')">巴厘岛</span>
    <span class="dp" onclick="q('New York')">纽约</span>
    <span class="dp" onclick="q('Barcelona')">巴塞罗那</span>
    <span class="dp" onclick="q('Kyoto')">京都</span>
  </div>
  <div class="err-box" id="err"></div>
</div>

<div class="loading" id="loading">
  <div class="loading-icon">🌍</div>
  <div class="loading-text" id="lmsg">正在收集目的地情报...</div>
</div>

<div class="results" id="results"></div>

</div><!-- main-scroll -->

  <div class="bottom-input">
    <input class="b-input" type="text" placeholder="Ask your travel coach..." />
    <button class="b-fab" type="button"><i data-lucide="arrow-up" style="width:24px"></i></button>
  </div>
</div><!-- app-container -->

<script>
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const q = v => { document.getElementById('inp').value = v; explore(); };

// Date display
document.getElementById('date-display').textContent = new Date().toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

async function post(path, body) {
  const r = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  const d = await r.json();
  if (!d.ok) throw new Error(d.error || '请求失败');
  return d;
}

async function explore() {
  const kw = document.getElementById('inp').value.trim();
  if (!kw) return;
  const btn = document.getElementById('btn');
  btn.disabled = true; btn.textContent = '整理中...';
  document.getElementById('loading').classList.add('show');
  document.getElementById('results').classList.remove('show');
  document.getElementById('results').innerHTML = '';
  document.getElementById('err').classList.remove('show');

  const msgs = ['正在收集目的地情报...', '搜寻住宿选项...', '检索旅行视频...', '整合旅者笔记...'];
  let mi = 0;
  const t = setInterval(() => { document.getElementById('lmsg').textContent = msgs[++mi % msgs.length]; }, 2200);

  try {
    const [wikiRes, hotelsRes, videosRes, redditRes] = await Promise.allSettled([
      post('/api/wikipedia', { keyword: kw }),
      post('/api/hotels', { keyword: kw }),
      post('/api/youtube-search', { keyword: kw + ' travel guide vlog' }),
      post('/api/reddit', { keyword: kw + ' travel tips reddit' })
    ]);
    clearInterval(t);

    const wiki = wikiRes.status === 'fulfilled' ? wikiRes.value : { article: null };
    const hotels = hotelsRes.status === 'fulfilled' ? hotelsRes.value : { hotels: [] };
    const videos = videosRes.status === 'fulfilled' ? videosRes.value : { videos: [] };
    const reddit = redditRes.status === 'fulfilled' ? redditRes.value : { posts: [] };

    if (wikiRes.status === 'rejected' && hotelsRes.status === 'rejected' && videosRes.status === 'rejected' && redditRes.status === 'rejected') {
      const el = document.getElementById('err');
      el.textContent = '❌ 目的地情报 API 暂时全部不可用（通常是外网网络问题），稍后再试试～';
      el.classList.add('show');
  if (window.lucide) lucide.createIcons();
    } else {
      render(wiki.article, hotels.hotels||[], videos.videos||[], reddit.posts||[], kw);
    }
  } catch(e) {
    clearInterval(t);
    const el = document.getElementById('err');
    el.textContent = '❌ ' + e.message;
    el.classList.add('show');
  } finally {
    btn.disabled = false; btn.textContent = '出发准备';
    document.getElementById('loading').classList.remove('show');
  }
}

function render(wiki, hotels, videos, posts, kw) {
  const el = document.getElementById('results');

  // Wiki section
  const wikiHTML = wiki ? `
    <div class="wiki-col">
      <div class="wiki-col-label">目的地情报</div>
      <div class="wiki-dest-title">${esc(wiki.title)}</div>
      ${wiki.description ? `<div class="wiki-desc">${esc(wiki.description)}</div>` : ''}
      ${wiki.thumbnail
        ? `<img class="wiki-img" src="${esc(wiki.thumbnail)}" />`
        : `<div class="wiki-img-ph">🗺️</div>`}
      <div class="wiki-text">${esc((wiki.extract||'').slice(0,600))}${(wiki.extract||'').length>600?'…':''}</div>
      ${wiki.url ? `<a class="wiki-read" href="${esc(wiki.url)}" target="_blank">阅读完整词条 →</a>` : ''}
    </div>` : `<div class="wiki-col"><div class="empty">暂无目的地资料</div></div>`;

  // Hotels section
  const hotelsHTML = hotels.length ? `
    <div class="hotels-col">
      <div class="hotels-col-label">住宿侦察 · ${hotels.length} 家选项</div>
      ${hotels.slice(0,5).map(h => `
        <a class="hotel-card" ${h.url?`href="${esc(h.url)}" target="_blank"`:''}>
          ${h.image
            ? `<img class="hotel-img" src="${esc(h.image)}" onerror="this.style.display='none'" />`
            : `<div class="hotel-img-ph">🏨</div>`}
          <div class="hotel-body">
            <div class="hotel-name">${esc(h.name)}</div>
            <div class="hotel-meta">
              ${h.stars ? `<span class="hotel-tag ht-stars">${'★'.repeat(Math.min(h.stars,5))}</span>` : ''}
              ${h.rating ? `<span class="hotel-tag ht-rating"><i data-lucide="star" style="width:14px"></i> ${h.rating}${h.reviews?` (${Number(h.reviews).toLocaleString()})`:''}</span>` : ''}
              ${h.location && typeof h.location === 'string' ? `<span class="hotel-tag ht-loc">📍 ${esc(h.location.slice(0,40))}</span>` : ''}
            </div>
            ${h.price ? `<div class="hotel-price">${esc(String(h.price))}</div>` : ''}
          </div>
        </a>`).join('')}
    </div>` : `<div class="hotels-col"><div class="empty">暂无住宿数据</div></div>`;

  // Videos
  const videosHTML = videos.length ? `
    <div class="section-divider">
      <div class="sd-title">出发前必看</div>
      <div class="sd-line"></div>
    </div>
    <div class="videos-section">
      <div class="videos-scroll">
        ${videos.slice(0,8).map(v => `
          <a class="yt-card" href="${esc(v.url)}" target="_blank">
            ${v.thumbnail
              ? `<img class="yt-thumb" src="${esc(v.thumbnail)}" onerror="this.style.display='none'" />`
              : `<div class="yt-thumb-ph">🎬</div>`}
            <div class="yt-body">
              <div class="yt-title">${esc(v.title)}</div>
              <div class="yt-meta">${esc(v.channel)} · ${esc(v.duration||'-')}</div>
            </div>
          </a>`).join('')}
      </div>
    </div>` : '';

  // Reddit
  const redditHTML = posts.length ? `
    <div class="section-divider">
      <div class="sd-title">旅者第一手笔记</div>
      <div class="sd-line"></div>
    </div>
    <div class="reddit-section">
      <div class="reddit-grid">
        ${posts.slice(0,6).map(p => `
          <div class="rc">
            ${p.subreddit ? `<div class="rc-sub">r/${esc(p.subreddit)}</div>` : ''}
            <div class="rc-title">${esc(p.title)}</div>
            ${p.body ? `<div class="rc-body">${esc(p.body)}</div>` : ''}
            <div class="rc-meta">
              <span class="rc-score">↑ ${(p.score||0).toLocaleString()}</span>
              <span class="rc-score">💬 ${p.comments||0}</span>
              ${p.url ? `<a class="rc-link" href="${esc(p.url)}" target="_blank">阅读 →</a>` : ''}
            </div>
          </div>`).join('')}
      </div>
    </div>` : '<div style="padding:0 40px 100px"><div class="empty">暂无旅者讨论</div></div>';

  el.innerHTML = `
    <div class="feature-spread">
      ${wikiHTML}
      ${hotelsHTML}
    </div>
    ${videosHTML}
    ${redditHTML}
  `;
  el.classList.add('show');
}

document.getElementById('inp').addEventListener('keydown', e => { if(e.key==='Enter') explore(); });
</script>

<script>
// Travel Atlas Onboarding (sequential, then triggers existing explore())
window.trObAnswers = { q1: null, q2: null };

function trObSelect(step, value, label, evt) {
  const qEl = document.getElementById('tr-ob-q' + step);
  if (!qEl) return;
  const btn = evt?.target;

  qEl.querySelectorAll('.ob-opt').forEach(x => x.classList.remove('selected'));
  if (btn) btn.classList.add('selected');

  if (step === 1) window.trObAnswers.q1 = { value, label };
  if (step === 2) window.trObAnswers.q2 = { value, label };

  const next = document.getElementById('tr-ob-q' + (step + 1));
  setTimeout(() => {
    qEl.classList.add('tr-hidden');
    if (next) {
      next.classList.remove('tr-hidden');
      return;
    }
    const inp = document.getElementById('inp');
    if (inp) inp.value = `${window.trObAnswers.q1?.value || ''} ${window.trObAnswers.q2?.value || ''}`.trim();
    trOnboardDone();
  }, 220);
}

function trOnboardDone() {
  if (typeof explore === 'function') explore();
}
</script>
  <script>lucide.createIcons();</script>
</body>
</html>
