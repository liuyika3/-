            lucide.createIcons();
          }

          ref: iconElement, 
          'data-lucide': iconName,

    const DemoBtn = ({ id, label, icon: Icon, onClick }) => (
      <button onClick={() => onClick(id)} className="w-full flex items-center gap-3 px-4 py-3 bg-white hover:bg-indigo-50 border border-gray-200 rounded-2xl transition-all group active:scale-95 shadow-sm">
        <div className="p-2 bg-gray-50 rounded-lg group-hover:bg-indigo-100 transition-colors"><Icon size={14} className="text-gray-400 group-hover:text-indigo-600" /></div>
        <span className="text-[10px] font-bold text-gray-600 group-hover:text-indigo-900 text-left leading-tight">{label}</span>
      </button>
    );

    // --- 独立的对话框和输入框组件 ---
    const ChatInput = ({ 
      currentView, 
      recentMessages, 
      searchQuery, 
      setSearchQuery, 
      handleSearchSubmit, 
      interactionStep, 
      activeFilter, 
      filterOptions, 
      handleOptionSelect, 
      setActiveFilter, 
      handleRestaurantSelected, 
      isUploadingImage,
      inputText,
      setInputText,
      sendMessage,
      handleNavigate,
      setInteractionStep
    }) => {
      return (
        <>
          {/* 对话框区域 - 带UI包裹 */}
          <div className="mb-3 animate-slide-up">
            {/* 对话框容器 - 与屏幕内容区分 */}
            <div className="bg-gradient-to-br from-indigo-50/50 via-white to-purple-50/30 rounded-3xl p-4 border-2 border-indigo-100/50 shadow-lg backdrop-blur-sm relative overflow-hidden">
              {/* 装饰性背景元素 */}
              <div className="absolute top-0 right-0 w-32 h-32 bg-indigo-200/20 rounded-full blur-2xl -mr-16 -mt-16"></div>
              <div className="absolute bottom-0 left-0 w-24 h-24 bg-purple-200/20 rounded-full blur-xl -ml-12 -mb-12"></div>
              
              {/* 对话框内容 */}
              <div className="relative flex flex-col gap-3">
                {/* 聊天消息 */}
                <div className="flex flex-col gap-2">
                  {recentMessages.map((msg, idx) => (
                    <div key={idx} className={`flex items-start gap-3 ${msg.role === 'user' ? 'justify-end' : ''}`}>
                      {msg.role === 'ai' && <div className="w-9 h-9 rounded-xl bg-white flex items-center justify-center shrink-0 border border-gray-100 shadow-sm overflow-hidden pt-1"><RabbitFace size="30" /></div>}
                      <div className={`${msg.role === 'user' ? 'bg-indigo-600 text-white' : 'bg-white/95 backdrop-blur-xl border border-white text-gray-600'} rounded-2xl p-3 shadow-lg max-w-[80%] ${msg.role === 'user' ? 'rounded-tr-none' : 'rounded-tl-none ring-1 ring-gray-100'}`}>
                        {msg.role === 'ai' && msg.title && <p className="text-xl font-black mb-0.5 text-gray-900">{msg.title}</p>}
                        <p className={`text-xl leading-relaxed font-bold ${msg.role === 'user' ? 'text-white' : ''}`} dangerouslySetInnerHTML={{ __html: msg.content }} />
                      </div>
                    </div>
                  ))}
                </div>

                {/* 首页的快捷按钮 */}
                {currentView === 'home' && (
                  <div className="flex gap-2 overflow-x-auto no-scrollbar py-1">
                    <PillBtn icon={RotateCcw} label="What to Eat" color="bg-rose-500" view="decision" onClick={() => handleNavigate('decision')} />
                    <PillBtn icon={ShoppingBag} label="我要备餐" color="bg-indigo-600" view="meal_prep" onClick={() => handleNavigate('meal_prep')} />
                    <PillBtn icon={Candy} label="想吃零食" color="bg-amber-500" view="snack" onClick={() => handleNavigate('snack')} />
                    <PillBtn icon={BookOpen} label="学习知识" color="bg-emerald-500" view="knowledge" onClick={() => handleNavigate('knowledge')} />
                  </div>
                )}

                {/* 非首页的筛选和输入区域 */}
                {currentView !== 'home' && (
                  <>
                    {/* 筛选选项面板 */}
                    {activeFilter && (
                      <div className="absolute bottom-20 left-5 right-5 mb-2 p-2 bg-white border border-indigo-100 rounded-2xl shadow-2xl flex flex-wrap gap-2 z-50 animate-bounce-in">
                        {(filterOptions[currentView] && filterOptions[currentView][activeFilter] ? filterOptions[currentView][activeFilter] : []).map(opt => (
                          <button key={opt} data-filter-option onClick={() => handleOptionSelect(activeFilter, opt)} className="px-3 py-1.5 bg-indigo-50 text-indigo-700 text-[11px] font-bold rounded-xl hover:bg-indigo-600 hover:text-white transition-all">{opt}</button>
                        ))}
                        <button onClick={() => setActiveFilter(null)} className="ml-auto p-1 text-gray-400"><X size={14}/></button>
                      </div>
                    )}

                    {/* 输入框区域 */}
                    <div className="bg-white rounded-[2rem] shadow-xl border border-gray-100 overflow-hidden">
                      {interactionStep !== 'restaurant_selected' && (
                        <div className="px-3 pt-3 pb-2 border-b border-gray-50 bg-gray-50/50">
                          <div className="grid grid-cols-3 gap-2">
                            {currentView === 'decision' && (
                              <>
                                <button data-restaurant-btn onClick={handleRestaurantSelected} className="col-span-2 flex items-center justify-center space-x-2 px-1 py-2.5 rounded-xl text-[10px] font-black transition-all active:scale-95 bg-indigo-600 text-white shadow-md shadow-indigo-100">
                                  <Store size={14} /><span>我选好餐厅了</span>
                                </button>
                                <QuickActionBtn filter="time" onClick={() => setActiveFilter('time')} icon={Timer} label="时间" />
                                <QuickActionBtn filter="people" onClick={() => setActiveFilter('people')} icon={Users} label="人数" />
                                <QuickActionBtn filter="taste" onClick={() => setActiveFilter('taste')} icon={SlidersHorizontal} label="口味" />
                                <QuickActionBtn filter="budget" onClick={() => setActiveFilter('budget')} icon={DollarSign} label="预算" />
                              </>
                            )}
                            {currentView === 'meal_prep' && (
                              <>
                                <QuickActionBtn onClick={() => setActiveFilter('prep_days')} icon={CalendarDays} label="天数" />
                                <QuickActionBtn onClick={() => setActiveFilter('storage')} icon={Box} label="储存" />
                                <QuickActionBtn onClick={() => setActiveFilter('grocery')} icon={ClipboardList} label="清单" />
                                <QuickActionBtn onClick={() => setActiveFilter('strategy')} icon={Zap} label="技巧" />
                                <QuickActionBtn onClick={() => setActiveFilter('flavor_profile')} icon={SlidersHorizontal} label="基调" />
                                <QuickActionBtn onClick={() => setActiveFilter('prep_budget')} icon={DollarSign} label="预算" />
                              </>
                            )}
                            {currentView === 'snack' && (
                              <>
                                <QuickActionBtn onClick={() => setActiveFilter('type')} icon={Candy} label="种类" />
                                <QuickActionBtn onClick={() => setActiveFilter('timing')} icon={Clock} label="时机" />
                                <QuickActionBtn onClick={() => setActiveFilter('goal')} icon={Trophy} label="目标" />
                              </>
                            )}
                            {currentView === 'knowledge' && (
                              <>
                                <QuickActionBtn onClick={() => setActiveFilter('topic')} icon={Brain} label="话题" />
                                <QuickActionBtn onClick={() => setActiveFilter('format')} icon={FileText} label="形式" />
                              </>
                            )}
                          </div>
                        </div>
                      )}

                      <div className="relative flex items-center p-1.5 px-3 h-12">
                        {interactionStep === 'restaurant_selected' ? (
                          <>
                            <button data-camera-btn="true" onClick={handleSearchSubmit} disabled={isUploadingImage} className={`flex-1 flex items-center justify-center gap-2 py-3 bg-indigo-50 border-2 border-indigo-300 border-dashed rounded-xl text-indigo-600 hover:bg-indigo-100 transition-all animate-pop-in active:scale-95 ${isUploadingImage ? 'opacity-50 cursor-not-allowed' : ''}`}>
                              {isUploadingImage ? (
                                <>
                                  <div className="w-6 h-6 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                                  <span className="text-[11px] font-black">正在上传...</span>
                                </>
                              ) : (
                                <>
                                  <Plus size={24} className="text-indigo-600" />
                                  <span className="text-[11px] font-black">拍照菜单或菜品</span>
                                </>
                              )}
                            </button>
                            <button onClick={() => setInteractionStep('initial')} className="ml-2 p-2 text-gray-400 hover:text-gray-600 transition-colors"><X size={20}/></button>
                          </>
                        ) : (
                          <>
                            <input 
                              type="text" 
                              className="flex-1 bg-transparent text-[11px] font-bold outline-none pl-1" 
                              placeholder="输入需求..."
                              value={searchQuery}
                              onChange={(e) => setSearchQuery(e.target.value)}
                              onKeyDown={(e) => e.key === 'Enter' && handleSearchSubmit()}
                            />
                            <div className="flex gap-1">
                              <button data-camera-btn onClick={handleSearchSubmit} className="p-2 bg-indigo-600 text-white rounded-full shadow-md active:scale-90 transition-transform flex items-center justify-center">
                                <Send size={14} />
                              </button>
                            </div>
                          </>
                        )}
                      </div>
                    </div>
                  </>
                )}

                {/* 首页的输入框 */}
                {currentView === 'home' && (
                  <div className="relative flex items-center gap-2">
                    <div className="flex-1 bg-white rounded-full shadow-xl border border-white flex items-center px-4 h-11">
                      <input type="text" className="flex-1 bg-transparent text-[10px] font-bold outline-none" placeholder="和 Jovida 教练聊聊..." value={inputText} onChange={(e) => setInputText(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && sendMessage()}/>
                      <Send size={16} className="text-indigo-600 cursor-pointer" onClick={sendMessage} />
                    </div>
                    <button className="w-11 h-11 bg-white rounded-full shadow-xl flex items-center justify-center text-gray-400 border border-white active:scale-90"><Plus size={20} /></button>
                  </div>
                )}
              </div>
            </div>
          </div>
                </>
      );
    };

    const PillBtn = ({ icon: Icon, label, color, onClick, view }) => (
      <button data-view={view} onClick={onClick} className={`${color} text-white flex items-center gap-1 px-3 py-2 rounded-full shadow-lg shrink-0 active:scale-95 transition-all`}>
        <Icon size={12} /><span className="text-[9px] font-black whitespace-nowrap">{label}</span>
      </button>
    );

    const QuickActionBtn = ({ icon: Icon, label, onClick, filter }) => (
      <button data-filter-btn={filter} onClick={onClick} className="flex items-center justify-center space-x-1 px-1 py-2 rounded-xl text-[10px] font-bold transition-all active:scale-95 border bg-white border-gray-200 text-gray-600 shadow-sm hover:border-indigo-300 hover:text-indigo-600">
        <Icon size={12} className="text-gray-400" /><span className="truncate max-w-[50px]">{label}</span>
      </button>
    );

    const RabbitFace = ({ size = "100" }) => (
      <svg width={size} height={size} viewBox="0 0 100 100" fill="none">
        <circle cx="50" cy="60" r="35" fill="#FFF" />
        <circle cx="40" cy="55" r="3" fill="#333" />
        <circle cx="60" cy="55" r="3" fill="#333" />
        <circle cx="35" cy="65" r="5" fill="#FFC0CB" opacity="0.4" />
        <circle cx="65" cy="65" r="5" fill="#FFC0CB" opacity="0.4" />
      </svg>
    );

    // Render the app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<WhatToEatPlanner />);
    
    // Initialize Lucide icons after render
    const initIcons = () => {
      if (typeof lucide !== 'undefined' && lucide.createIcons) {
        lucide.createIcons();
      } else {
        setTimeout(initIcons, 100);
      }
    };
    
    // Wait for DOM and Lucide to be ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initIcons);
    } else {
      setTimeout(initIcons, 500);
    }
    
    // Also initialize on window load
    window.addEventListener('load', () => {
      setTimeout(() => {
        if (typeof lucide !== 'undefined' && lucide.createIcons) {
          lucide.createIcons();
        }
      }, 100);
    });
  </script>
</body>
</html>
